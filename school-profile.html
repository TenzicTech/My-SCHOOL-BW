<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>School Profile - MY SCHOOL BW</title>
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .school-profile {
            max-width: 1000px;
            margin: 2rem auto;
        }

        .school-header {
            text-align: center;
            padding: 2rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            margin-bottom: 2rem;
        }

        .school-header h1 {
            font-size: 2.5rem;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .school-header .badge {
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        .badge.public { background: rgba(96, 165, 250, 0.15); color: #93c5fd; }
        .badge.private { background: rgba(52, 211, 153, 0.15); color: #86efac; }
        .badge.international { background: rgba(242, 113, 33, 0.15); color: #fbbf24; }

        .school-stats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 1rem;
            text-align: center;
        }

        .stat-box .number {
            font-size: 2rem;
            font-weight: 700;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-box .label {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .info-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 1.5rem;
        }

        .info-card h3 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .info-card .contact-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-glass);
        }

        .info-card .contact-item:last-child {
            border-bottom: none;
        }

        .info-card .contact-item .icon { font-size: 1.2rem; }
        .info-card .contact-item .value { color: var(--text-secondary); }

        .history-timeline {
            position: relative;
            padding-left: 2rem;
        }

        .history-timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border-glass);
        }

        .history-item {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .history-item::before {
            content: '';
            position: absolute;
            left: -2rem;
            top: 6px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--gradient-main);
            border: 2px solid var(--bg-primary);
        }

        .history-item .date {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .history-item .title {
            font-weight: 600;
        }

        .history-item .desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 0.2rem;
        }

        .back-btn {
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            border: 1px solid var(--border-glass);
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-family);
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        @media (max-width: 768px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
            .school-header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
