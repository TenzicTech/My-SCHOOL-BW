<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Profile - MY SCHOOL BW</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .school-profile {
            max-width: 1000px;
            margin: 2rem auto;
        }

        .school-header {
            text-align: center;
            padding: 2rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            margin-bottom: 2rem;
        }

        .school-header h1 {
            font-size: 2.5rem;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .school-header .badge {
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        .badge.public { background: rgba(96, 165, 250, 0.15); color: #93c5fd; }
        .badge.private { background: rgba(52, 211, 153, 0.15); color: #86efac; }
        .badge.international { background: rgba(242, 113, 33, 0.15); color: #fbbf24; }

        .school-stats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 1rem;
            text-align: center;
        }

        .stat-box .number {
            font-size: 2rem;
            font-weight: 700;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-box .label {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .info-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 1.5rem;
        }

        .info-card h3 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .info-card .contact-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-glass);
        }

        .info-card .contact-item:last-child {
            border-bottom: none;
        }

        .info-card .contact-item .icon { font-size: 1.2rem; }
        .info-card .contact-item .value { color: var(--text-secondary); }

        .history-timeline {
            position: relative;
            padding-left: 2rem;
        }

        .history-timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border-glass);
        }

        .history-item {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .history-item::before {
            content: '';
            position: absolute;
            left: -2rem;
            top: 6px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--gradient-main);
            border: 2px solid var(--bg-primary);
        }

        .history-item .date {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .history-item .title {
            font-weight: 600;
        }

        .history-item .desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 0.2rem;
        }

        .back-btn {
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            border: 1px solid var(--border-glass);
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-family);
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        @media (max-width: 768px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
            .school-header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>

    <div class="container">
        <div class="topnav">
            <div class="brand">MY<span>SCHOOL</span>BW</div>
            <button class="hamburger" id="hamburgerBtn" aria-label="Toggle navigation menu">
                <span></span><span></span><span></span>
            </button>
            <a href="index.html">HOME</a>
<a href="registration.html">REGISTRATION</a>
<a href="account.html">MY ACCOUNT</a>
<a href="school-selector.html">🏫 SCHOOLS</a>
<a href="school-profile.html">🏫 SCHOOL PROFILE</a>
<a href="administration.html">ADMINISTRATION</a>
            <div class="search-container">
                <form id="search-form">
                    <input type="text" placeholder="Search.." name="search" id="search-input">
                    <button type="submit">Search</button>
                </form>
            </div>
            <div class="results-container" id="search-results" style="display: none;"></div>
        </div>

        <div class="school-profile" id="schoolProfile">
            <!-- Dynamically populated -->
        </div>
    </div>

    <script>
    const API_URL ='https://my-school-bw-c0gh.onrender.com/api';
    
    function loadSchoolProfile() {
        const school = JSON.parse(localStorage.getItem('selectedSchool'));
        if (!school) {
            document.getElementById('schoolProfile').innerHTML = `
                <div style="text-align:center; padding:3rem; color: var(--text-muted);">
                    <p>No school selected. <a href="school-selector.html" style="color: #60A5FA;">Select a school</a></p>
                </div>
            `;
            return;
        }

        const histories = JSON.parse(localStorage.getItem('schoolHistories')) || {};
        const history = histories[school.id] || [];

        document.getElementById('schoolProfile').innerHTML = `
            <div class="school-header">
                <h1>🏫 ${school.name}</h1>
                <span class="badge ${(school.type || 'public').toLowerCase()}">${school.type || 'Public School'}</span>
                <p style="color: var(--text-secondary); margin-top: 0.5rem;">${school.location || ''}${school.country ? ', ' + school.country : ''}</p>
                ${school.motto ? `<p style="color: var(--text-muted); font-style: italic; margin-top: 0.3rem;">"${school.motto}"</p>` : ''}
                ${school.description ? `<p style="color: var(--text-secondary); margin-top: 0.5rem;">${school.description}</p>` : ''}
            </div>

            <div class="school-stats">
                <div class="stat-box">
                    <div class="number">${school.students || 0}</div>
                    <div class="label">👨‍🎓 Students</div>
                </div>
                <div class="stat-box">
                    <div class="number">${school.teachers || 0}</div>
                    <div class="label">👩‍🏫 Teachers</div>
                </div>
                <div class="stat-box">
                    <div class="number">${school.totalSubjects || 0}</div>
                    <div class="label">📚 Subjects</div>
                </div>
                <div class="stat-box">
                    <div class="number">${school.totalClasses || 0}</div>
                    <div class="label">🏫 Classes</div>
                </div>
            </div>

            <div class="info-grid">
                <div class="info-card">
                    <h3>📞 Contact Information</h3>
                    ${school.phone ? `<div class="contact-item"><span class="icon">📞</span><span class="value">${school.phone}</span></div>` : ''}
                    ${school.email ? `<div class="contact-item"><span class="icon">📧</span><span class="value">${school.email}</span></div>` : ''}
                    ${school.website ? `<div class="contact-item"><span class="icon">🌐</span><span class="value"><a href="${school.website}" target="_blank" style="color: #60A5FA;">${school.website}</a></span></div>` : ''}
                    ${school.contacts?.address ? `<div class="contact-item"><span class="icon">📍</span><span class="value">${school.contacts.address}</span></div>` : ''}
                    ${school.contacts?.postal ? `<div class="contact-item"><span class="icon">📮</span><span class="value">${school.contacts.postal}</span></div>` : ''}
                </div>

                <div class="info-card">
                    <h3>📋 School Details</h3>
                    <div class="contact-item"><span class="icon">🏛️</span><span class="value">Type: ${school.type || 'N/A'}</span></div>
                    <div class="contact-item"><span class="icon">🌍</span><span class="value">Country: ${school.country || 'N/A'}</span></div>
                    <div class="contact-item"><span class="icon">📚</span><span class="value">Grades: ${school.grades ? school.grades.join(', ') : 'N/A'}</span></div>
                    <div class="contact-item"><span class="icon">🗣️</span><span class="value">Language: ${school.language || 'N/A'}</span></div>
                </div>
            </div>

            <div class="info-card" style="margin-bottom: 2rem;">
                <h3>📜 School History</h3>
                ${history.length === 0 ? 
                    '<p style="color: var(--text-muted);">No history entries available.</p>' :
                    `<div class="history-timeline">${history.sort((a,b) => new Date(b.date) - new Date(a.date)).map(entry => `
                        <div class="history-item">
                            <div class="date">${new Date(entry.date).toLocaleDateString()}</div>
                            <div class="title">${entry.title}</div>
                            <div class="desc">${entry.description}</div>
                        </div>
                    `).join('')}</div>`
                }
            </div>

            <button class="back-btn" onclick="window.location.href='school-selector.html'">← Back to Schools</button>
        `;
    }

    // Hamburger menu
    document.getElementById('hamburgerBtn').addEventListener('click', function() {
        this.classList.toggle('active');
        document.querySelectorAll('.topnav a').forEach(a => a.classList.toggle('mobile-show'));
        document.querySelector('.topnav .search-container').classList.toggle('mobile-show');
    });

    // Search
    document.getElementById('search-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const query = document.getElementById('search-input').value.trim();
        const container = document.getElementById('search-results');
        container.style.display = 'block';
        if (!query) {
            container.innerHTML = '<p>Please enter a search term.</p>';
            return;
        }
        const results = [
            { title: 'School Profile', description: 'View school information and history.', url: 'school-profile.html' },
            { title: 'School Selector', description: 'Find and select your school.', url: 'school-selector.html' }
        ].filter(r => r.title.toLowerCase().includes(query.toLowerCase()) || r.description.toLowerCase().includes(query.toLowerCase()));
        container.innerHTML = results.length === 0 
            ? `<p>No results found for "${query}".</p>`
            : results.map(r => `<div class="result-item"><h3><a href="${r.url}">${r.title}</a></h3><p>${r.description}</p></div>`).join('');
    });

    document.addEventListener('click', function(e) {
        const container = document.getElementById('search-results');
        const searchContainer = document.querySelector('.search-container');
        if (!searchContainer.contains(e.target)) container.style.display = 'none';
    });

    window.onload = loadSchoolProfile;
    
    </script>
</body>
</html>
