<!-- ===== FORGOT PASSWORD FORM ===== -->
<div id="forgot-password-form" style="display:none;">
    <h2>Reset Password</h2>
    <div class="alert alert-info" id="forgotAlert" style="display:none;"></div>
    <form id="forgotPasswordForm">
        <!-- Step 1: Enter Email -->
        <div class="step active" id="step1">
            <div class="form-group">
                <label for="forgot-email">Email Address</label>
                <input type="email" id="forgot-email" name="email" placeholder="your@email.com" autocomplete="email" required>
                <span class="error-message" id="forgot-email-error">Please enter a valid email.</span>
                <div style="font-size:0.8rem; color:var(--text-muted); margin-top:0.3rem;">
                    We'll send a 6-digit code to your email
                </div>
            </div>
            <div class="form-group">
                <button type="button" onclick="sendResetCode()">📧 Send Verification Code</button>
            </div>
        </div>
        
        <!-- Step 2: Enter Code & New Password -->
        <div class="step" id="step2">
            <div class="form-group">
                <label for="reset-code">Verification Code</label>
                <input type="text" id="reset-code" name="code" placeholder="Enter 6-digit code" maxlength="6" required>
                <span class="error-message" id="reset-code-error">Invalid or expired code.</span>
                <div style="font-size:0.8rem; color:var(--text-muted); margin-top:0.3rem;">
                    Enter the 6-digit code sent to your email
                </div>
            </div>
            <div class="form-group">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" name="password" placeholder="••••••••" autocomplete="new-password" required>
                <button type="button" class="show-password" onclick="togglePassword('new-password')">Show Password</button>
                <span class="error-message" id="new-password-error">Password must be 8+ characters with a number and special character.</span>
            </div>
            <div class="form-group">
                <label for="confirm-new-password">Confirm New Password</label>
                <input type="password" id="confirm-new-password" name="confirm-password" placeholder="••••••••" autocomplete="new-password" required>
                <button type="button" class="show-password" onclick="togglePassword('confirm-new-password')">Show Password</button>
                <span class="error-message" id="confirm-new-password-error">Passwords do not match.</span>
            </div>
            <div class="form-group">
                <button type="button" onclick="resetPassword()">🔄 Reset Password</button>
            </div>
            <div style="text-align:center; margin-top:0.5rem;">
                <button type="button" onclick="document.getElementById('step2').classList.remove('active'); document.getElementById('step1').classList.add('active');" style="background:transparent; border:none; color:var(--text-muted); cursor:pointer; font-size:0.85rem; text-decoration:underline;">
                    ← Back to email
                </button>
            </div>
        </div>
    </form>
    <div class="form-switch">
        <a href="#" onclick="showLogin()">← Back to Login</a>
    </div>
</div>
