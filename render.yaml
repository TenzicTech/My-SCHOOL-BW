services:
  - type: web
    name: myschoolbw-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false  # ← THIS IS IMPORTANT! Set it manually in dashboard
      - key: JWT_SECRET
        sync: false  # ← THIS IS IMPORTANT! Set it manually in dashboard
