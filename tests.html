<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
    <style>
        .test-container {
            max-width: 900px;
            margin: 2rem auto;
        }

        .test-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .test-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .test-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .test-selector {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .test-selector select,
        .test-selector button {
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            border: 1px solid var(--border-glass);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-family);
            font-size: 0.95rem;
            min-width: 140px;
        }

        .test-selector select option {
            background: #1a1a1a;
            color: var(--text-primary);
        }

        .test-selector select:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .test-selector button {
            background: rgba(255, 255, 255, 0.05);
        }

        .test-selector button.active {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .test-selector button:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .test-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 2rem;
            margin-bottom: 1.5rem;
            transition: var(--transition);
        }

        .test-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .test-card h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .test-card .meta {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .test-card .meta span {
            margin-right: 1rem;
        }

        .question {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            border-left: 3px solid rgba(255, 255, 255, 0.1);
        }

        .question p {
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .options label {
            display: block;
            padding: 0.5rem 1rem;
            margin: 0.3rem 0;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-glass);
            cursor: pointer;
            transition: var(--transition);
        }

        .options label:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .options input[type="radio"] {
            margin-right: 0.5rem;
        }

        .options input[type="radio"]:checked+span {
            color: var(--text-primary);
        }

        .btn-test {
            padding: 0.6rem 2rem;
            border-radius: 40px;
            border: 1px solid var(--border-glass);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-family);
            font-size: 0.95rem;
        }

        .btn-test:hover {
            background: var(--text-primary);
            color: var(--bg-primary);
        }

        .btn-test:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-box {
            padding: 1.5rem;
            border-radius: var(--radius);
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        .result-box.pass {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #86efac;
        }

        .result-box.fail {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .result-box .score {
            font-size: 2rem;
            font-weight: 700;
        }

        .test-content {
            display: none;
        }

        .test-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin: 1rem 0;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #4fc3f7, #29b6f6);
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        .test-selection-info {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .test-selection-info .highlight {
            color: var(--text-primary);
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .test-header h1 {
                font-size: 1.8rem;
            }
            .test-card {
                padding: 1.2rem;
            }
            .test-selector {
                flex-direction: column;
                align-items: stretch;
            }
            .test-selector select,
            .test-selector button {
                width: 100%;
                min-width: unset;
            }
            .test-selection-info {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

        let currentSubject = 'math';
        let currentGrade = 1;
        let currentQuestions = [];

        // Load test based on selection
        function loadTest() {
            currentSubject = document.getElementById('subjectSelect').value;
            currentGrade = parseInt(document.getElementById('gradeSelect').value);

            // Update display
            const subjectNames = {
                math: 'Mathematics',
                english: 'English',
                science: 'Science',
                setswana: 'Setswana'
            };
            document.getElementById('displaySubject').textContent = subjectNames[currentSubject];
            document.getElementById('displayGrade').textContent = `Grade ${currentGrade}`;

            // Get questions
            const questions = questionBank[currentSubject]?.[currentGrade];
            if (!questions) {
                document.getElementById('questionsContainer').innerHTML = '<p style="color: var(--text-muted);">No questions available for this combination.</p>';
                return;
            }

            currentQuestions = questions.questions;
            document.getElementById('testTitle').textContent = questions.title;

            // Render questions
            const container = document.getElementById('questionsContainer');
            container.innerHTML = currentQuestions.map((q, index) => `
                <div class="question">
                    <p>${index + 1}. ${q.q}</p>
                    <div class="options">
                        ${q.options.map(opt => `
                            <label>
                                <input type="radio" name="q${index}" value="${opt.charAt(0)}">
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            // Reset progress and results
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('submitBtn').disabled = false;

            // Scroll to test
            document.getElementById('testContent').scrollIntoView({ behavior: 'smooth' });
        }

        // Submit test
        function submitTest() {
            const questions = currentQuestions;
            let score = 0;
            let answered = 0;

            questions.forEach((q, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if (selected) {
                    answered++;
                    if (selected.value === q.answer) {
                        score++;
                    }
                }
            });

            // Update progress
            const progress = document.getElementById('progressBar');
            progress.style.width = `${(answered / questions.length) * 100}%`;

            // Show result
            const resultBox = document.getElementById('resultBox');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const feedback = document.getElementById('feedbackDisplay');

            resultBox.style.display = 'block';
            const percentage = (score / questions.length) * 100;

            if (percentage >= 70) {
                resultBox.className = 'result-box pass';
                scoreDisplay.textContent = `⭐ ${score}/${questions.length} (${percentage}%)`;
                feedback.textContent = '🎉 Excellent work! Your child has passed this test! Keep up the great effort!';
            } else {
                resultBox.className = 'result-box fail';
                scoreDisplay.textContent = `📝 ${score}/${questions.length} (${percentage}%)`;
                feedback.textContent = '📚 Keep practicing! Review the material and try again. You can do it!';
            }

            document.getElementById('submitBtn').disabled = true;
        }

        // Hamburger menu
        document.getElementById('hamburgerBtn').addEventListener('click', function() {
            this.classList.toggle('active');
            const links = document.querySelectorAll('.topnav a');
            const search = document.querySelector('.topnav .search-container');
            links.forEach(link => link.classList.toggle('mobile-show'));
            search.classList.toggle('mobile-show');
        });

        // Search
        document.getElementById('search-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const query = document.getElementById('search-input').value.trim();
            const container = document.getElementById('search-results');
            container.style.display = 'block';

            if (!query) {
                container.innerHTML = '<p>Please enter a search term.</p>';
                return;
            }

            const results = [
                { title: 'Math Quiz', description: 'Test your child\'s math skills.', url: '#math' },
                { title: 'English Quiz', description: 'Assess English language skills.', url: '#english' },
                { title: 'Science Quiz', description: 'Explore science concepts.', url: '#science' },
                { title: 'Setswana Quiz', description: 'Test Setswana language skills.', url: '#setswana' }
            ].filter(r => r.title.toLowerCase().includes(query.toLowerCase()) || r.description.toLowerCase().includes(query.toLowerCase()));

            if (results.length === 0) {
                container.innerHTML = `<p>No results found for "${query}".</p>`;
                return;
            }

            container.innerHTML = results.map(r =>
                `<div class="result-item"><h3><a href="${r.url}">${r.title}</a></h3><p>${r.description}</p></div>`
            ).join('');
        });

        document.addEventListener('click', function(e) {
            const container = document.getElementById('search-results');
            const searchContainer = document.querySelector('.search-container');
            if (!searchContainer.contains(e.target)) {
                container.style.display = 'none';
            }
        });

        // Load default test on page load
        window.onload = function() {
            loadTest();
        };
