<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Tests - MY SCHOOL BW</title>
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .test-container {
            max-width: 900px;
            margin: 2rem auto;
        }

        .test-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .test-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .test-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .test-selector {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .test-selector select,
        .test-selector button {
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            border: 1px solid var(--border-glass);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-family);
            font-size: 0.95rem;
            min-width: 140px;
        }

        .test-selector select option {
            background: #1a1a1a;
            color: var(--text-primary);
        }

        .test-selector select:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .test-selector button {
            background: rgba(255, 255, 255, 0.05);
        }

        .test-selector button.active {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .test-selector button:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .test-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 2rem;
            margin-bottom: 1.5rem;
            transition: var(--transition);
        }

        .test-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .test-card h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .test-card .meta {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .test-card .meta span {
            margin-right: 1rem;
        }

        .question {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            border-left: 3px solid rgba(255, 255, 255, 0.1);
        }

        .question p {
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .options label {
            display: block;
            padding: 0.5rem 1rem;
            margin: 0.3rem 0;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-glass);
            cursor: pointer;
            transition: var(--transition);
        }

        .options label:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .options input[type="radio"] {
            margin-right: 0.5rem;
        }

        .options input[type="radio"]:checked+span {
            color: var(--text-primary);
        }

        .btn-test {
            padding: 0.6rem 2rem;
            border-radius: 40px;
            border: 1px solid var(--border-glass);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-family);
            font-size: 0.95rem;
        }

        .btn-test:hover {
            background: var(--text-primary);
            color: var(--bg-primary);
        }

        .btn-test:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-box {
            padding: 1.5rem;
            border-radius: var(--radius);
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        .result-box.pass {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #86efac;
        }

        .result-box.fail {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .result-box .score {
            font-size: 2rem;
            font-weight: 700;
        }

        .test-content {
            display: none;
        }

        .test-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin: 1rem 0;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #4fc3f7, #29b6f6);
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        .test-selection-info {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .test-selection-info .highlight {
            color: var(--text-primary);
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .test-header h1 {
                font-size: 1.8rem;
            }
            .test-card {
                padding: 1.2rem;
            }
            .test-selector {
                flex-direction: column;
                align-items: stretch;
            }
            .test-selector select,
            .test-selector button {
                width: 100%;
                min-width: unset;
            }
            .test-selection-info {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Navigation -->
        <div class="topnav">
            <div class="brand">MY<span>SCHOOL</span>BW</div>
            <button class="hamburger" id="hamburgerBtn" aria-label="Toggle navigation menu">
                <span></span><span></span><span></span>
            </button>
            <a href="administration.html">ADMINISTRATION</a>
            <a href="level.html">EDUCATION LEVELS</a>
            <a href="registration.html">REGISTRATION</a>
            <a href="school-profile.html">PROFILE</a>
            <a href="school-selector.html">SCHOOLS</a>
            <a href="subjects.html">SUBJECTS</a>
            <a href="tests.html">QUICK TESTS</a>
            <div class="search-container">
                <form id="search-form">
                    <input type="text" placeholder="Search.." name="search" id="search-input">
                    <button type="submit">Search</button>
                </form>
            </div>
            <div class="results-container" id="search-results" style="display: none;"></div>
        </div>

        <!-- Test Header -->
        <div class="test-header">
            <h1>📝 Quick Tests</h1>
            <p>Select a subject and grade level to test your child's knowledge</p>
        </div>

        <!-- Test Selection -->
        <div class="test-selector">
            <select id="subjectSelect">
                <option value="math">🔢 Mathematics</option>
                <option value="english">📖 English</option>
                <option value="science">🔬 Science</option>
                <option value="setswana">🗣️ Setswana</option>
            </select>
            <select id="gradeSelect">
                <option value="1">Grade 1</option>
                <option value="2">Grade 2</option>
                <option value="3">Grade 3</option>
                <option value="4">Grade 4</option>
                <option value="5">Grade 5</option>
                <option value="6">Grade 6</option>
                <option value="7">Grade 7</option>
            </select>
            <button onclick="loadTest()">Start Test</button>
        </div>

        <!-- Test Selection Info -->
        <div class="test-selection-info" id="testInfo">
            <span>📚 Subject: <span class="highlight" id="displaySubject">Mathematics</span></span>
            <span>🎓 Grade: <span class="highlight" id="displayGrade">Grade 1</span></span>
        </div>

        <!-- Test Content -->
        <div class="test-container">
            <div class="test-content active" id="testContent">
                <div class="test-card">
                    <h3 id="testTitle">🔢 Mathematics Quiz - Grade 1</h3>
                    <div class="meta">
                        <span>📝 5 Questions</span>
                        <span>⏱️ 10 minutes</span>
                        <span>⭐ Passing: 70%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="fill" id="progressBar" style="width: 0%;"></div>
                    </div>

                    <div id="questionsContainer">
                        <!-- Questions will be loaded here -->
                    </div>

                    <button class="btn-test" id="submitBtn" onclick="submitTest()">Submit Test</button>
                    <div class="result-box" id="resultBox">
                        <div class="score" id="scoreDisplay"></div>
                        <p id="feedbackDisplay"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- ===== UNIVERSAL SCRIPT ===== -->
 <script src="js/script.js"></script>
</body>
</html>
